name: Dokploy Offload
description: Keep Docker builds off your VPS. Build on GitHub Actions, publish to GHCR, and deploy with Dokploy.
author: EcompJr
branding:
  icon: upload-cloud
  color: blue

inputs:
  services:
    description: "Services to deploy: fullstack, both, back, or frontend (backend is an alias for back)"
    default: "both"
  github-token:
    description: "Token with packages:write; pass secrets.GITHUB_TOKEN"
    required: true
  webhook-url:
    description: "Dokploy webhook, called once after all builds"
    required: true
  image-prefix:
    description: "Image prefix without registry; defaults to owner/repository"
    default: ""
  tag:
    description: "Mutable deployment tag configured in Dokploy"
    default: "latest"
  platforms:
    description: "Docker target platforms"
    default: "linux/amd64"
  fullstack-context:
    description: "Docker build context"
    default: "."
  fullstack-file:
    description: "Dockerfile path"
    default: "Dockerfile"
  fullstack-target:
    description: "Optional Docker build stage"
    default: ""
  fullstack-build-args:
    description: "Newline-separated Docker build arguments"
    default: ""
  fullstack-secrets:
    description: "Newline-separated BuildKit secrets"
    default: ""
  backend-context:
    description: "Docker build context"
    default: "backend"
  backend-file:
    description: "Dockerfile path"
    default: "backend/Dockerfile"
  backend-target:
    description: "Optional Docker build stage"
    default: ""
  backend-build-args:
    description: "Newline-separated Docker build arguments"
    default: ""
  backend-secrets:
    description: "Newline-separated BuildKit secrets"
    default: ""
  frontend-context:
    description: "Docker build context"
    default: "frontend"
  frontend-file:
    description: "Dockerfile path"
    default: "frontend/Dockerfile"
  frontend-target:
    description: "Optional Docker build stage"
    default: ""
  frontend-build-args:
    description: "Newline-separated Docker build arguments"
    default: ""
  frontend-secrets:
    description: "Newline-separated BuildKit secrets"
    default: ""

outputs:
  fullstack-image:
    description: Published fullstack deployment image reference
    value: ${{ steps.plan.outputs.fullstack-image }}
  backend-image:
    description: Published backend deployment image reference
    value: ${{ steps.plan.outputs.backend-image }}
  frontend-image:
    description: Published frontend deployment image reference
    value: ${{ steps.plan.outputs.frontend-image }}
  fullstack-digest:
    description: Published fullstack image digest
    value: ${{ steps.fullstack.outputs.digest }}
  backend-digest:
    description: Published backend image digest
    value: ${{ steps.backend.outputs.digest }}
  frontend-digest:
    description: Published frontend image digest
    value: ${{ steps.frontend.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Validate deployment configuration
      id: plan
      shell: bash
      env:
        SERVICES: ${{ inputs.services }}
        IMAGE_PREFIX: ${{ inputs.image-prefix }}
        IMAGE_TAG: ${{ inputs.tag }}
        WEBHOOK_URL: ${{ inputs.webhook-url }}
      run: node "$GITHUB_ACTION_PATH/scripts/deploy.mjs" plan
    - uses: docker/setup-qemu-action@v3
      if: inputs.platforms != 'linux/amd64'
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Build and publish fullstack
      id: fullstack
      if: steps.plan.outputs.fullstack == 'true'
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.fullstack-context }}
        file: ${{ inputs.fullstack-file }}
        target: ${{ inputs.fullstack-target }}
        platforms: ${{ inputs.platforms }}
        build-args: ${{ inputs.fullstack-build-args }}
        secrets: ${{ inputs.fullstack-secrets }}
        push: true
        tags: |
          ${{ steps.plan.outputs.fullstack-image }}
          ${{ steps.plan.outputs.fullstack-sha-image }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=${{ steps.plan.outputs.fullstack-cache }}
        cache-to: type=gha,mode=max,scope=${{ steps.plan.outputs.fullstack-cache }}

    - name: Build and publish backend
      id: backend
      if: steps.plan.outputs.backend == 'true'
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.backend-context }}
        file: ${{ inputs.backend-file }}
        target: ${{ inputs.backend-target }}
        platforms: ${{ inputs.platforms }}
        build-args: ${{ inputs.backend-build-args }}
        secrets: ${{ inputs.backend-secrets }}
        push: true
        tags: |
          ${{ steps.plan.outputs.backend-image }}
          ${{ steps.plan.outputs.backend-sha-image }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=${{ steps.plan.outputs.backend-cache }}
        cache-to: type=gha,mode=max,scope=${{ steps.plan.outputs.backend-cache }}

    - name: Build and publish frontend
      id: frontend
      if: steps.plan.outputs.frontend == 'true'
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.frontend-context }}
        file: ${{ inputs.frontend-file }}
        target: ${{ inputs.frontend-target }}
        platforms: ${{ inputs.platforms }}
        build-args: ${{ inputs.frontend-build-args }}
        secrets: ${{ inputs.frontend-secrets }}
        push: true
        tags: |
          ${{ steps.plan.outputs.frontend-image }}
          ${{ steps.plan.outputs.frontend-sha-image }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=${{ steps.plan.outputs.frontend-cache }}
        cache-to: type=gha,mode=max,scope=${{ steps.plan.outputs.frontend-cache }}

    - name: Trigger Dokploy after all images are published
      shell: bash
      env:
        SERVICES: ${{ inputs.services }}
        WEBHOOK_URL: ${{ inputs.webhook-url }}

      run: node "$GITHUB_ACTION_PATH/scripts/deploy.mjs" deploy
